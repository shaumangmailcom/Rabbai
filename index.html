      .animate-pop-in {

      .bg-parquet {

      @keyframes net-wiggle {
        0%, 100% { transform: scaleY(1) skewX(0deg); }
        50% { transform: scaleY(1.3) skewX(10deg); }
      }

        0%, 100% { stroke: #ef4444; filter: drop-shadow(0 0 2px #ef4444); }
        50% { stroke: #f87171; filter: drop-shadow(0 0 12px #ef4444); fill: rgba(239, 68, 68, 0.2); }

      .animate-wiggle {
        animation: net-wiggle 0.35s ease-in-out;
      }

        animation: rim-violation 0.2s ease-in-out infinite;

      // Web Audio Synthesizer (Real-time arena noise generation)
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      let isMuted = false;

      const sounds = {
        playTone(frequency, type, duration, gainStart, slideToFreq = null) {
          if (isMuted) return;
          try {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.type = type;
            osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            
            if (slideToFreq) {
              osc.frequency.exponentialRampToValueAtTime(slideToFreq, audioCtx.currentTime + duration);
            }
            
            gainNode.gain.setValueAtTime(gainStart, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
          } catch (e) {
            console.warn("Audio Context blocked.");
          }
        },

        playDribble() {
          this.playTone(110, 'triangle', 0.15, 0.4, 40);
        },

        playSneakerSqueak() {
          this.playTone(2800, 'sine', 0.08, 0.08, 3000);
        },

        playBlockSlap() {
          this.playTone(220, 'sawtooth', 0.12, 0.6, 90);
          this.playTone(850, 'sine', 0.1, 0.3);
        },

        playDunkSlam() {
          this.playTone(60, 'sine', 0.5, 0.8, 20); 
          this.playTone(180, 'sawtooth', 0.35, 0.5, 120); 
          this.playTone(950, 'triangle', 0.25, 0.3); 
          
          const now = audioCtx.currentTime;
          const bufferSize = audioCtx.sampleRate * 0.4;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = audioCtx.createBufferSource();
          noise.buffer = buffer;
          const filter = audioCtx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(1400, now);
          filter.Q.setValueAtTime(4, now);
          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.5, now);
          gain.gain.exponentialRampToValueAtTime(0.005, now + 0.35);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);
          noise.start(now);

          setTimeout(() => this.playCheer(), 100);
        },

        playSwish() {
          if (isMuted) return;
          const now = audioCtx.currentTime;
          const bufferSize = audioCtx.sampleRate * 0.3;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = audioCtx.createBufferSource();
          noise.buffer = buffer;

          const filter = audioCtx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(1200, now);
          filter.frequency.exponentialRampToValueAtTime(800, now + 0.2);
          filter.Q.setValueAtTime(5, now);

          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.005, now + 0.28);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);
          noise.start(now);

          setTimeout(() => this.playCheer(), 150);
        },

        playClank() {
          if (isMuted) return;
          const now = audioCtx.currentTime;
          const osc1 = audioCtx.createOscillator();
          const osc2 = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          
          osc1.type = 'triangle'; osc1.frequency.setValueAtTime(145, now);
          osc2.type = 'sine'; osc2.frequency.setValueAtTime(320, now);
          
          gain.gain.setValueAtTime(0.5, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          
          osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
          osc1.start(now); osc2.start(now);
          osc1.stop(now + 0.25); osc2.stop(now + 0.25);

          setTimeout(() => this.playGroan(), 200);
        },

        playCheer() {
          if (isMuted) return;
          const now = audioCtx.currentTime;
          const bufferSize = audioCtx.sampleRate * 1.1;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = audioCtx.createBufferSource();
          noise.buffer = buffer;

          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(500, now);
          filter.frequency.exponentialRampToValueAtTime(950, now + 0.5);

          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.05);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);
          noise.start(now);
        },

        playGroan() {
          if (isMuted) return;
          const now = audioCtx.currentTime;
          const bufferSize = audioCtx.sampleRate * 0.8;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = audioCtx.createBufferSource();
          noise.buffer = buffer;

          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(220, now);

          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.75);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);
          noise.start(now);
        },

        playBuzzer() {
          if (isMuted) return;
          const now = audioCtx.currentTime;
          const osc1 = audioCtx.createOscillator();
          const osc2 = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          
          osc1.type = 'sawtooth'; osc1.frequency.setValueAtTime(95, now);
          osc2.type = 'sawtooth'; osc2.frequency.setValueAtTime(98, now);
          
          gain.gain.setValueAtTime(0.45, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 1.2);
          
          osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
          osc1.start(now); osc2.start(now);
          osc1.stop(now + 1.2); osc2.stop(now + 1.2);
          setTimeout(() => this.playGroan(), 500);
        },

        playWhistle() {
          const now = audioCtx.currentTime;
          const osc1 = audioCtx.createOscillator();
          const osc2 = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          
          osc1.type = 'sine'; osc1.frequency.setValueAtTime(2200, now);
          osc2.type = 'sine'; osc2.frequency.setValueAtTime(2215, now); 
          
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          
          osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
          osc1.start(now); osc2.start(now);
          osc1.stop(now + 0.4); osc2.stop(now + 0.4);
        },

        playTick() {
          this.playTone(880, 'sine', 0.05, 0.12);
        },

        playOrganCharge() {
          if (isMuted) return;
          const notes = [392.00, 392.00, 392.00, 523.25, 659.25, 783.99];
          const timings = [0, 0.12, 0.24, 0.36, 0.48, 0.60];
          const durations = [0.08, 0.08, 0.08, 0.12, 0.12, 0.55];
          const now = audioCtx.currentTime;
          
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + timings[idx]);
            gain.gain.setValueAtTime(0.15, now + timings[idx]);
            gain.gain.exponentialRampToValueAtTime(0.005, now + timings[idx] + durations[idx]);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + timings[idx]);
            osc.stop(now + timings[idx] + durations[idx]);
          });
        }
      };

      // App state
      let state = {
        phase: 'welcome',
        currentQuestion: null,
        currentIndex: 0,
        score: 0, 
        streak: 0,
        maxStreak: 0,
        questionsList: [],
        timeLeft: 5.0, 
        reviewData: [],
        
        // Active court positions
        playerX: 35,
        defenderX: 110,
        bballBounceY: 110,
        isShooting: false,
        shootOutcome: null, 
        shootFrame: 0,
        
        // Timer mechanics
        lastAnimationFrame: null,
        lastTime: null,
        dribbleTimer: 0,
        squeakTimer: 0,
        commentaryTimer: 0
      };

      function initApp() {
        renderWelcomeScreen();
        setupGlobalKeyListeners();
      }

      // Generate localized, mixed true/false gameplay matrices dynamically
      function buildBlitzRounds() {
        const rawPool = JSON.parse(JSON.stringify(vocabulary));
        const shuffled = rawPool.sort(() => 0.5 - Math.random());
        
        return shuffled.map((item) => {
          const isTrue = Math.random() < 0.5;
          let shownEnglish = item.english;
          
          if (!isTrue) {
            // Pick a completely different translation to serve as deceptive defense
            let alternative = vocabulary[Math.floor(Math.random() * vocabulary.length)];
            while (alternative.hebrew === item.hebrew) {
              alternative = vocabulary[Math.floor(Math.random() * vocabulary.length)];
            }
            shownEnglish = alternative.english;
          }
          
          return {
            hebrew: item.hebrew,
            correctEnglish: item.english,
            shownEnglish: shownEnglish,
            isTrue: isTrue,
            page: item.page
          };
        });
      }

      function startBlitzGame() {
        sounds.playOrganCharge();
        state.phase = 'playing';
        state.currentIndex = 0;
        state.score = 0;
        state.streak = 0;
        state.maxStreak = 0;
        state.questionsList = buildBlitzRounds();
        state.reviewData = [];
        loadQuestion(0);
      }

      function toggleMute() {
        isMuted = !isMuted;
        const muteBtn = document.getElementById('mute-btn');
        if (muteBtn) {
          muteBtn.innerText = isMuted ? "🔇" : "🔊";
        }
      }

      function loadQuestion(index) {
        if (index >= state.questionsList.length) {
          endGame();
          return;
        }
        state.currentIndex = index;
        state.currentQuestion = state.questionsList[index];
        state.timeLeft = 5.0;
        state.playerX = 35;
        state.defenderX = 110;
        state.isShooting = false;
        state.shootOutcome = null;
        state.shootFrame = 0;
        state.dribbleTimer = 0;
        state.squeakTimer = Math.random() * 2 + 1;
        state.commentaryTimer = 0;

        renderQuestionScreen();
        sounds.playWhistle(); 
        updateCommentatorBox('dribbling');
        
        state.lastTime = performance.now();
        if (state.lastAnimationFrame) cancelAnimationFrame(state.lastAnimationFrame);
        state.lastAnimationFrame = requestAnimationFrame(gameLoop);
      }

      function gameLoop(now) {
        if (state.phase !== 'playing') return;
        
        const delta = (now - state.lastTime) / 1000;
        state.lastTime = now;

        if (!state.isShooting) {
          state.timeLeft -= delta;
          if (state.timeLeft <= 0) {
            state.timeLeft = 0;
            updateTimerUI();
            sounds.playBuzzer();
            handleAnswerSubmission(null);
            return;
          }

          const pct = 1 - (state.timeLeft / 5.0);
          state.playerX = 35 + pct * 205; 
          state.defenderX = state.playerX + 50 + Math.sin(Date.now() / 120) * 8; 

          tickAudioAndVisuals(delta);
          updateTimerUI();
          updateCourtLiveGraphics();
          
          state.lastAnimationFrame = requestAnimationFrame(gameLoop);
        }
      }

      function tickAudioAndVisuals(delta) {
        state.dribbleTimer += delta;
        const bounceCycle = (Date.now() / 150) % Math.PI;
        state.bballBounceY = 104 + Math.abs(Math.sin(bounceCycle)) * 26;

        if (state.bballBounceY >= 127 && state.dribbleTimer > 0.2) {
          sounds.playDribble();
          state.dribbleTimer = 0;
          createCourtSparkParticle();
        }

        state.squeakTimer -= delta;
        if (state.squeakTimer <= 0) {
          sounds.playSneakerSqueak();
          state.squeakTimer = Math.random() * 2.5 + 1.2;
        }

        if (state.timeLeft <= 2.0) {
          const secondInt = Math.ceil(state.timeLeft);
          if (!state.lastTickVal || state.lastTickVal !== secondInt) {
            sounds.playTick();
            state.lastTickVal = secondInt;
          }
        }

        state.commentaryTimer += delta;
        if (state.commentaryTimer >= 1.6) {
          updateCommentatorBox('dribbling');
          state.commentaryTimer = 0;
        }
      }

      function createCourtSparkParticle() {
        const sparks = document.getElementById('court-particles');
        if (!sparks) return;
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', state.playerX + 16);
        circle.setAttribute('cy', '133');
        circle.setAttribute('r', '2');
        circle.setAttribute('fill', '#FDB927');
        circle.setAttribute('opacity', '0.8');
        circle.style.transition = "all 0.3s ease-out";
        sparks.appendChild(circle);
        setTimeout(() => {
          circle.setAttribute('r', '6');
          circle.setAttribute('opacity', '0');
        }, 10);
        setTimeout(() => circle.remove(), 350);
      }

      function updateTimerUI() {
        const bar = document.getElementById('timer-bar');
        const num = document.getElementById('timer-num');
        if (bar) {
          const pct = (state.timeLeft / 5.0) * 100;
          bar.style.width = `${pct}%`;
          if (state.timeLeft <= 1.5) {
            bar.classList.remove('bg-[#FDB927]');
            bar.classList.add('bg-red-500');
          } else {
            bar.classList.remove('bg-red-500');
            bar.classList.add('bg-[#FDB927]');
          }
        }
        if (num) {
          num.innerText = state.timeLeft.toFixed(1);
        }
      }

      function updateCourtLiveGraphics() {
        const playerG = document.getElementById('player-node');
        const defenderG = document.getElementById('defender-node');
        const bball = document.getElementById('bball-node');
        
        const bob = Math.sin(Date.now() / 85) * 4;
        const defBob = Math.sin(Date.now() / 95) * 3;
        
        if (playerG) {
          playerG.setAttribute('transform', `translate(${state.playerX}, ${bob})`);
        }
        if (defenderG) {
          defenderG.setAttribute('transform', `translate(${state.defenderX}, ${defBob})`);
        }
        if (bball && !state.isShooting) {
          bball.setAttribute('cx', state.playerX + 22);
          bball.setAttribute('cy', state.bballBounceY + bob);
        }

        const leftLeg = document.getElementById('player-leg-left');
        const rightLeg = document.getElementById('player-leg-right');
        if (leftLeg && rightLeg) {
          const angle = Math.sin(Date.now() / 100) * 22;
          leftLeg.setAttribute('transform', `rotate(${angle}, 12, 105)`);
          rightLeg.setAttribute('transform', `rotate(${-angle}, 12, 105)`);
        }

        const defLeftLeg = document.getElementById('def-leg-left');
        const defRightLeg = document.getElementById('def-leg-right');
        if (defLeftLeg && defRightLeg) {
          const defAngle = Math.sin(Date.now() / 80) * 15;
          defLeftLeg.setAttribute('transform', `rotate(${defAngle}, 12, 105)`);
          defRightLeg.setAttribute('transform', `rotate(${-defAngle}, 12, 105)`);
        }
      }

      function handleAnswerSubmission(userChoice) {
        if (state.isShooting) return;
        cancelAnimationFrame(state.lastAnimationFrame);
        
        const q = state.currentQuestion;
        const timedOut = (userChoice === null);
        const isCorrect = !timedOut && (userChoice === q.isTrue);

        if (isCorrect) {
          state.score++;
          state.streak++;
          if (state.streak > state.maxStreak) state.maxStreak = state.streak;
        } else {
          state.streak = 0;
        }

        state.reviewData.push({
          hebrew: q.hebrew,
          correctEnglish: q.correctEnglish,
          shownEnglish: q.shownEnglish,
          isTrue: q.isTrue,
          userAnswer: timedOut ? 'Shotclock Violation' : (userChoice ? 'True' : 'False'),
          status: isCorrect ? 'correct' : (timedOut ? 'timeout' : 'wrong'),
          page: q.page
        });

        const poseDribble = document.getElementById('pose-dribble');
        const poseShoot = document.getElementById('pose-shoot');
        if (poseDribble && poseShoot) {
          poseDribble.classList.add('hidden');
          poseShoot.classList.remove('hidden');
        }

        state.isShooting = true;

        if (isCorrect) {
          state.shootOutcome = 'swish'; 
          updateCommentatorBox('swish');
        } else if (timedOut) {
          state.shootOutcome = 'steal'; 
          updateCommentatorBox('steal');
        } else {
          state.shootOutcome = (Math.random() < 0.5) ? 'block' : 'brick';
          updateCommentatorBox(state.shootOutcome);
        }

        animateDetailedCourtShot();
      }

      function animateDetailedCourtShot() {
        const ball = document.getElementById('bball-node');
        const player = document.getElementById('player-node');
        const defender = document.getElementById('defender-node');
        const net = document.getElementById('net-mesh');
        const rim = document.getElementById('court-rim');
        
        const startX = state.playerX + 22;
        const startY = 82; 
        
        const rimX = 390; 
        const rimY = 60;
        
        let targetX = rimX;
        let targetY = rimY;
        let peakY = 15; 

        let totalFrames = 45;

        if (state.shootOutcome === 'brick') {
          targetX = rimX - 10; 
          targetY = rimY;
        } else if (state.shootOutcome === 'block') {
          targetX = state.defenderX + 5;
          targetY = 40; 
          totalFrames = 20; 
        } else if (state.shootOutcome === 'steal') {
          targetX = state.defenderX;
          targetY = 115;
          totalFrames = 15;
        }

        let frame = 0;

        function runShotFrame() {
          frame++;
          const t = frame / totalFrames;

          const apexX = (startX + targetX) / 2;
          const currX = (1-t)*(1-t)*startX + 2*(1-t)*t*apexX + t*t*targetX;
          const currY = (1-t)*(1-t)*startY + 2*(1-t)*t*peakY + t*t*targetY;

          if (state.shootOutcome === 'swish') {
            const playerJumpX = startX + t * (rimX - startX - 30);
            const playerJumpY = startY + Math.sin(t * Math.PI) * -65;
            if (player) player.setAttribute('transform', `translate(${playerJumpX}, ${playerJumpY - 80})`);
            
            if (ball) {
              ball.setAttribute('cx', playerJumpX + 22);
              ball.setAttribute('cy', playerJumpY - 80 + 72);
            }
          } else {
            if (frame < 15) {
              const jumpY = Math.sin((frame / 15) * Math.PI) * -22;
              if (player) player.setAttribute('transform', `translate(${state.playerX}, ${jumpY})`);
            } else {
              const landingT = Math.min(1, (frame - 15) / 15);
              const descendY = -22 + landingT * 22;
              if (player) player.setAttribute('transform', `translate(${state.playerX}, ${descendY})`);
            }

            if (ball && state.shootOutcome !== 'steal') {
              ball.setAttribute('cx', currX);
              ball.setAttribute('cy', currY);
              const rotation = frame * 20;
              ball.setAttribute('transform', `rotate(${rotation}, ${currX}, ${currY})`);
            }
          }

          if (state.shootOutcome === 'swish') {
            if (t > 0.4) {
              const tPoster = (t - 0.4) / 0.6;
              const defFallX = state.defenderX - tPoster * 40;
              const defFallY = Math.sin(tPoster * Math.PI) * -12 + tPoster * 10;
              const angle = tPoster * 75; 
              if (defender) {
                defender.setAttribute('transform', `translate(${defFallX}, ${defFallY}) rotate(${-angle}, 12, 105)`);
              }
            } else {
              const defJumpY = Math.sin((t / 0.4) * Math.PI) * -16;
              if (defender) defender.setAttribute('transform', `translate(${state.defenderX}, ${defJumpY})`);
            }
          } else if (state.shootOutcome === 'brick') {
            if (frame > 5 && frame < 30) {
              const defJumpY = Math.sin(((frame - 5) / 25) * Math.PI) * -24; 
              if (defender) defender.setAttribute('transform', `translate(${state.defenderX}, ${defJumpY})`);
            }
          } else if (state.shootOutcome === 'block') {
            const defJumpY = Math.sin((frame / totalFrames) * Math.PI) * -38;
            if (defender) defender.setAttribute('transform', `translate(${state.defenderX}, ${defJumpY})`);
          } else if (state.shootOutcome === 'steal') {
            const lungeX = state.defenderX - (t * 25);
            if (defender) defender.setAttribute('transform', `translate(${lungeX}, 5)`);
          }

          if (frame < totalFrames) {
            requestAnimationFrame(runShotFrame);
          } else {
            triggerShotCollision(state.shootOutcome);
          }
        }

        requestAnimationFrame(runShotFrame);
      }

      function triggerShotCollision(outcome) {
        const ball = document.getElementById('bball-node');
        const net = document.getElementById('net-mesh');
        const rim = document.getElementById('court-rim');
        const defender = document.getElementById('defender-node');

        if (outcome === 'swish') {
          sounds.playDunkSlam();
          if (net) net.classList.add('animate-wiggle');
          
          let dropFrame = 0;
          function dropBall() {
            dropFrame++;
            const bY = 60 + dropFrame * 6;
            if (ball) ball.setAttribute('cx', 390);
            if (ball) ball.setAttribute('cy', bY);
            if (dropFrame < 10) requestAnimationFrame(dropBall);
          }
          requestAnimationFrame(dropBall);
          showAnswerFeedback(true, false);

        } else if (outcome === 'block') {
          sounds.playBlockSlap();
          
          let blockFallFrame = 0;
          const startX = state.defenderX + 5;
          const startY = 40;
          
          function swatBall() {
            blockFallFrame++;
            const t = blockFallFrame / 20;
            const bX = startX - t * 140;
            const bY = startY + t * 90 - Math.sin(t * Math.PI) * 15;
            if (ball) {
              ball.setAttribute('cx', bX);
              ball.setAttribute('cy', bY);
            }
            if (blockFallFrame < 20) requestAnimationFrame(swatBall);
          }
          requestAnimationFrame(swatBall);
          showAnswerFeedback(false, false);

        } else if (outcome === 'brick') {
          sounds.playClank();
          if (rim) {
            rim.setAttribute('stroke', '#ef4444');
            setTimeout(() => rim.setAttribute('stroke', '#f97316'), 200);
          }

          let brickFrame = 0;
          function bounceBrick() {
            brickFrame++;
            const t = brickFrame / 22;
            const bX = 380 - t * 60;
            const bY = 60 + Math.sin(t * Math.PI) * -40 + t * 75;
            if (ball) {
              ball.setAttribute('cx', bX);
              ball.setAttribute('cy', bY);
            }
            if (brickFrame < 22) requestAnimationFrame(bounceBrick);
          }
          requestAnimationFrame(bounceBrick);
          showAnswerFeedback(false, false);

        } else if (outcome === 'steal') {
          sounds.playTone(450, 'sawtooth', 0.15, 0.35);
          if (ball) ball.setAttribute('opacity', '0');
          
          let stealFrame = 0;
          const startDefX = state.defenderX;
          function defenderDribblesAway() {
            stealFrame++;
            const currentDefX = startDefX - (stealFrame * 8);
            if (defender) defender.setAttribute('transform', `translate(${currentDefX}, 5)`);
            if (stealFrame < 30) requestAnimationFrame(defenderDribblesAway);
          }
          requestAnimationFrame(defenderDribblesAway);
          showAnswerFeedback(false, true);
        }
      }

      function showAnswerFeedback(isCorrect, timedOut) {
        sounds.playWhistle(); 
        const tBtn = document.getElementById('btn-true');
        const fBtn = document.getElementById('btn-false');
        if (tBtn && fBtn) {
          tBtn.disabled = true;
          fBtn.disabled = true;
        }

        const indicator = document.getElementById('court-announcer');
        if (indicator) {
          indicator.classList.remove('hidden');
          if (isCorrect) {
            indicator.innerHTML = `
              <div class="bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 p-4 rounded-2xl text-center">
                <span class="text-xs font-black uppercase tracking-[0.2em] block mb-0.5 text-emerald-500">🔥 SWISH DUNK!</span>
                <span class="text-sm font-extrabold">Rabba posterized Abaye! A rishonim-level dunk oyf him!</span>
              </div>
            `;
          } else {
            const headerMsg = timedOut ? "🚨 SHOT CLOCK VIOLATION!" : "💥 REJECTED BY ABAYE!";
            let breakdownText = "";
            
            if (timedOut) {
              breakdownText = "Held the ball past the 5.0-second buzzer! Abaye stripped it clean.";
            } else {
              breakdownText = `The defender swatted it away! "${state.currentQuestion.hebrew}" standard translation is "${state.currentQuestion.correctEnglish}"`;
            }

            indicator.innerHTML = `
              <div class="bg-red-500/10 border border-red-500/20 text-red-400 p-4 rounded-2xl text-center">
                <span class="text-xs font-black uppercase tracking-[0.2em] block mb-0.5 text-red-500">${headerMsg}</span>
                <span class="text-xs font-bold leading-relaxed block text-slate-300">${breakdownText}</span>
              </div>
            `;
          }
        }

        if (!timedOut) {
          const selectedBtn = state.currentQuestion.isTrue ? tBtn : fBtn;
          if (isCorrect) {
            selectedBtn?.classList.add('bg-[#FDB927]', 'text-slate-950', 'border-[#FDB927]', 'scale-105');
          } else {
            const wrongBtn = state.currentQuestion.isTrue ? fBtn : tBtn;
            wrongBtn?.classList.add('bg-red-500', 'text-white', 'border-red-400', 'scale-105');
          }
        }

        setTimeout(() => {
          loadQuestion(state.currentIndex + 1);
        }, isCorrect ? 1500 : 3500); 
      }

      function updateCommentatorBox(type) {
        const pool = commentaries[type];
        const randomQuote = pool[Math.floor(Math.random() * pool.length)];
        
        const commQuote = document.getElementById('comm-quote');
        const commSpeaker = document.getElementById('comm-speaker');
        const commAvatar = document.getElementById('comm-avatar');
        
        const isYitzchok = Math.random() < 0.5;
        
        if (commQuote) {
          commQuote.innerText = `"${randomQuote}"`;
        }
        if (commSpeaker) {
          commSpeaker.innerText = isYitzchok ? "YITZCHOK (YSN)" : "MOISHE (YSN)";
        }
        if (commAvatar) {
          commAvatar.classList.toggle('bg-purple-600', isYitzchok);
          commAvatar.classList.toggle('bg-teal-600', !isYitzchok);
          commAvatar.innerText = isYitzchok ? "🎙️ Y" : "🎧 M";
        }
      }

      function endGame() {
        state.phase = 'results';
        renderResultsScreen();
      }

      function renderWelcomeScreen() {
        const card = document.getElementById('game-card');
        card.innerHTML = `
          <div class="animate-pop-in flex flex-col justify-between h-full space-y-8">
            <div class="text-center py-4">
              <div class="inline-flex items-center justify-center bg-[#552583]/30 border border-[#FDB927]/40 px-4 py-1.5 rounded-full text-xs text-[#FDB927] font-black mb-4 tracking-widest uppercase">

      function renderResultsScreen() {
        const card = document.getElementById('game-card');
        const pct = Math.round((state.score / state.questionsList.length) * 100);
        
        let draftReport = "Bench warmer status. Back to the practice court! 👟";
        let tierColor = "text-rose-500";
        if (pct >= 90) {
          draftReport = "UNDISPUTED NBA GOAT CHAMPION! Halakhah follows Rabba! 🏆";
          tierColor = "text-[#FDB927]";
        } else if (pct >= 70) {
          draftReport = "PLAYOFFS CHIEF STARTER! Heavy posterization on Abaye. 🏀";
          tierColor = "text-emerald-400";
        }

        const logHTML = state.reviewData.map((item, i) => {
          const ok = item.status === 'correct';
          let playType = "SWISH DUNK! Posterized Abaye";
          let badgeColor = "text-emerald-400 bg-emerald-500/10 border-emerald-500/20";
          
          if (item.status === 'wrong') {
            playType = "BRICK! Contested by Abaye";
            badgeColor = "text-rose-400 bg-rose-500/10 border-rose-500/20";
          } else if (item.status === 'timeout') {
            playType = "TURNOVER! Abaye steals the rock";
            badgeColor = "text-rose-500 bg-red-500/10 border-red-500/20";
          }

          return `
            <div class="p-4 border-b border-purple-950 flex justify-between items-start text-xs bg-black/20 hover:bg-black/40 transition-colors last:border-0">
              <div class="flex-1 mr-4">
                <div class="flex items-center gap-2 mb-1.5">
                  <span class="font-hebrew font-black text-white text-base" dir="rtl">${item.hebrew}</span>
                  <span class="text-[8px] font-black bg-purple-950/80 border border-purple-900/50 text-purple-300 px-2 py-0.5 rounded">Pg ${item.page}</span>
                </div>
                <p class="text-slate-400 leading-relaxed"><strong class="text-purple-400 font-bold">Standard Meaning:</strong> ${item.correctEnglish}</p>
                ${!ok ? `<p class="text-rose-400 mt-1.5"><strong class="text-rose-600">The Defender claimed:</strong> "${item.shownEnglish}"</p>` : ''}
              </div>
              <div class="text-right flex-shrink-0 mt-1">
                <span class="${badgeColor} px-2.5 py-1 rounded-xl border text-[8px] font-black uppercase tracking-wider block">
                  ${playType}
                </span>
              </div>
            </div>
          `;
        }).join('');

      function setupGlobalKeyListeners() {
        document.addEventListener('keydown', (e) => {
          if (state.phase !== 'playing') return;
          if (state.isShooting) return;

          const key = e.key.toLowerCase();
          
          if (key === 'arrowleft' || key === 'f') {
            const btn = document.getElementById('btn-false');
            if (btn && !btn.disabled) btn.click();
          } else if (key === 'arrowright' || key === 't' || key === 'j') {
            const btn = document.getElementById('btn-true');
            if (btn && !btn.disabled) btn.click();
          }
        });
      }

      window.onload = initApp;
